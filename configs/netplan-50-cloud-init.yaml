# /etc/netplan/50-cloud-init.yaml on the Wazuh manager VM
# Static IP so the Wazuh agents always find the manager.
network:
  version: 2
  ethernets:
    ens33:
      dhcp4: false
      addresses:
        - 192.168.1.24/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [192.168.1.1, 8.8.8.8]

# Also stop cloud-init from regenerating this file on reboot:
#   echo "network: {config: disabled}" | sudo tee /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
# Apply with:
#   sudo netplan apply
